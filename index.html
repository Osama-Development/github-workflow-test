<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Workflow Test</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#eef2ff;font-family:system-ui,sans-serif;padding:24px}
main{width:min(100%,580px);padding:40px;border:1px solid #39435b;border-radius:24px;background:#1b263b;text-align:center}
h1{font-size:clamp(1.6rem,5vw,2.4rem)}p{line-height:1.8;color:#cbd5e1}button{padding:14px 24px;border:0;border-radius:12px;background:#a5b4fc;color:#101827;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#c7d2fe}button:focus-visible{outline:3px solid white;outline-offset:5px}#status{min-height:2em}
</style>
</head>
<body><main>
<h1>مرحبًا بك في تجربة GitHub 👋</h1>
<p>صفحة تجريبية لاختبار الكود والفروع والإصدارات.</p>
<button id="welcome" type="button">جرّب الزر التفاعلي</button>
<p id="status" role="status" aria-live="polite">اضغط الزر لعرض رسالة الترحيب.</p>
</main>
<script>
const button=document.querySelector('#welcome');
const status=document.querySelector('#status');
let clicks=0;
button.addEventListener('click',()=>{clicks+=1;status.textContent='أهلًا بك! الزر يعمل بنجاح. عدد النقرات: '+clicks;});
</script></body></html>
